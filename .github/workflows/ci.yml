name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

env:
  DATABASE_URL: postgresql+asyncpg://hotel_user:hotel_pass@localhost:5432/hotel_test

jobs:
  hotel-utils-testpypi:
    name: hotel-utils (TestPyPI)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install hotel-utils from TestPyPI
        run: |
          VERSION=$(grep '^version = ' packages/hotel_utils/pyproject.toml | cut -d'"' -f2)
          python -m pip install --upgrade pip
          pip install pytest
          pip install -i https://test.pypi.org/simple/ "hotel-utils==${VERSION}"

      - name: Verify package origin
        run: |
          python -c "import hotel_utils, pathlib; p = pathlib.Path(hotel_utils.__file__).resolve(); assert 'site-packages' in str(p), p"

      - name: Run unit tests against TestPyPI wheel
        # pyproject.toml addopts require pytest-cov; this job only pip-installs pytest
        run: pytest tests/unit -v -o addopts=

  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: hotel_test
          POSTGRES_USER: hotel_user
          POSTGRES_PASSWORD: hotel_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pip install poetry==1.8.3

      - name: Install dependencies
        run: poetry install --with dev

      - name: Lint
        run: poetry run ruff check .

      - name: Run migrations
        run: poetry run python -m app.db.migrate

      - name: Run tests
        run: >-
          poetry run pytest tests/unit tests/integration -v
          --cov=app
          --cov=packages/hotel_utils/src
          --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false
